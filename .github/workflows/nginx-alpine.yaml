name: Nginx For Alpine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - entrypoint.sh
      - alpine/Dockerfile
      - .github/workflows/nginx-alpine.yaml

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: nginx-alpine-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/nginx
  IMAGE_TAG: alpine
  PLATFORMS: linux/amd64
  SKOPEO_IMAGE: quay.io/skopeo/stable:latest

jobs:
  build-and-push:
    name: Build, push, and scan Alpine image
    runs-on: |
      ubuntu-latest
      # - self-hosted
      # - linux
      # - x64
    # timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Nginx version
        run: |
          set -euo pipefail

          version="$(
            curl -fsSL https://nginx.org/en/download.html \
              | grep -Eo 'nginx-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | head -n1 \
              | sed -E 's/^nginx-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz$/\1/'
          )"

          if [ -z "$version" ]; then
            echo "Failed to resolve the latest Nginx version." >&2
            exit 1
          fi

          echo "NGINX_VERSION=$version" >> "$GITHUB_ENV"
          echo "Using Nginx $version"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./alpine/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          no-cache: true
          outputs: type=oci,dest=${{ runner.temp }}/nginx-${{ env.IMAGE_TAG }}.oci.tar,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          tags: ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            VERSION=${{ env.NGINX_VERSION }}

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          auth_dir="${RUNNER_TEMP}/skopeo-auth"
          mkdir -p "$auth_dir"

          printf '%s' "$DOCKERHUB_TOKEN" | docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            -e REGISTRY_AUTH_FILE=/auth/config.json \
            -v "${auth_dir}:/auth" \
            "${SKOPEO_IMAGE}" \
            login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io

      - name: Push Docker image
        run: |
          set -euo pipefail

          auth_dir="${RUNNER_TEMP}/skopeo-auth"
          archive="/work/nginx-${IMAGE_TAG}.oci.tar"

          copy_image() {
            destination="$1"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e REGISTRY_AUTH_FILE=/auth/config.json \
              -v "${auth_dir}:/auth" \
              -v "${RUNNER_TEMP}:/work" \
              "${SKOPEO_IMAGE}" \
              copy --all \
              "oci-archive:${archive}" \
              "docker://${destination}"
          }

          copy_image "${DOCKER_REPO}:${IMAGE_TAG}"
          copy_image "${DOCKER_REPO}:latest"

      - name: Output image info
        run: |
          echo "Image pushed successfully"
          echo "Repository: ${{ env.DOCKER_REPO }}"
          echo "Tags: ${{ env.IMAGE_TAG }}, latest"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_REPO }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-alpine.sarif
          skip-db-update: false
          skip-java-db-update: false

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-alpine.sarif
          category: container-vulnerability-scan-alpine
